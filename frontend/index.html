<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP + Fabrika Simülasyonu</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: #0f172a; color: #e2e8f0;
  }
  header {
    background: #1e293b; border-bottom: 1px solid #334155;
    padding: 12px 24px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.4px; }
  .ws { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  .ws.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .ws.offline { background: #64748b; box-shadow: none; }
  .ws.connecting { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr; gap: 24px; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 340px; } }

  /* Fırın kartları */
  .furnace-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 16px 18px; position: relative;
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .type { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-left: 8px; }
  .temp-row { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
  .temp { font-size: 44px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -1px; }
  .unit { font-size: 20px; color: #94a3b8; }
  .meta { font-size: 13px; color: #cbd5e1; margin-top: 6px; display: flex; gap: 18px; flex-wrap: wrap; }
  .meta b { color: #f8fafc; }
  .spark { margin-top: 12px; width: 100%; height: 52px; background: #0b1120; border: 1px solid #334155; border-radius: 8px; display: block; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 10px; }
  .status.ON { background: #166534; color: #bbf7d0; }
  .status.OFF { background: #475569; color: #cbd5e1; }
  .status.ALARM { background: #7f1d1d; color: #fecaca; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.55; } }

  .alarm-box {
    margin-top: 10px; padding: 8px 10px; background: #7f1d1d; color: #fecaca;
    border-radius: 8px; font-size: 13px; display: none;
  }
  .alarm-box.show { display: block; }

  /* Üretim emirleri */
  section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; }
  h3 { margin: 0 0 14px; font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #94a3b8; padding: 6px 8px; border-bottom: 1px solid #334155; font-weight: 600; }
  td { padding: 7px 8px; border-bottom: 1px solid #2d3a52; color: #cbd5e1; font-variant-numeric: tabular-nums; }
  tr:nth-child(even) td { background: #161e2e; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .badge.CREATED { background: #334155; color: #cbd5e1; }
  .badge.RUNNING { background: #15803d; color: #bbf7d0; }
  .badge.COMPLETED { background: #1d4ed8; color: #bfdbfe; }
  .badge.CANCELLED { background: #475569; color: #94a3b8; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  input, select {
    width: 100%; background: #0f172a; border: 1px solid #475569; color: #e2e8f0;
    padding: 8px 10px; border-radius: 8px; font-size: 13px;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  button {
    background: #2563eb; color: #fff; border: none; padding: 9px 16px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #3b82f6; }
  button.secondary { background: #475569; }
  button.secondary:hover { background: #64748b; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .alarms { max-height: 220px; overflow-y: auto; font-size: 12px; }
  .alarm-item { padding: 6px 8px; border-bottom: 1px solid #2d3a52; color: #fca5a5; }
  .alarm-item .time { color: #94a3b8; margin-right: 8px; font-family: ui-monospace, SFMono-Regular; }
  .muted { color: #64748b; font-size: 12px; }

  .start-row { display: flex; gap: 8px; margin-top: 6px; }
  select.furnace-select { max-width: 170px; }

  /* Hız kontrolü (sağ üst) */
  .speed-box { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .speed-box .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .speed-btns { display: flex; gap: 3px; background: #0f172a; padding: 3px; border-radius: 9px; border: 1px solid #334155; }
  .speed-btns button {
    background: transparent; color: #cbd5e1; border: none; padding: 5px 9px;
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; line-height: 1;
  }
  .speed-btns button:hover { background: #334155; }
  .speed-btns button.active { background: #2563eb; color: #fff; }
  .speed-btns button:disabled { opacity: 0.4; }
  #speedInfo { font-size: 11px; color: #64748b; min-width: 54px; }
  @media (max-width: 820px) {
    header { flex-wrap: wrap; }
    .speed-box { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="ws" id="wsDot" title="Tarayıcı ↔ yerel ERP backend (WebSocket). Gerçek ERP/fabrika bağlantısı DEĞİLDİR."></div>
  <h1>ERP + Fabrika Simülasyonu <span class="type">· Canlı makine takibi</span></h1>
  <button id="btnReconnect" class="secondary" style="padding:4px 10px;font-size:12px;" title="Sayfayı yenilemeden bağlantıyı yeniden dener">Yeniden bağlan</button>

  <div class="speed-box">
    <span class="label">Simülasyon hızı</span>
    <div class="speed-btns" id="speedBtns"></div>
    <span id="speedInfo" title="Kaç saniyelik simülasyon zamanı, 1 gerçek saniyede işleniyor"></span>
  </div>
  <span class="muted" id="wsStatus" style="display:none;">Yerel sunucuya bağlanıyor…</span>
</header>

<main>
  <div>
    <div class="furnace-grid" id="furnaceGrid">
      <!-- JS tarafından doldurulur -->
    </div>
  </div>

  <section style="grid-column: 1 / -1;">
    <h3>Üretim Emirleri</h3>
    <div class="grid2">
      <input id="inpProduct" placeholder="Ürün (ör. Alüminyum Profili)">
      <input id="inpTarget" type="number" placeholder="Hedef sıcaklık (°C)" value="750">
    </div>
    <div class="grid2">
      <select id="inpFurnace" class="furnace-select"></select>
      <input id="inpDuration" type="number" placeholder="Süre (dk)" value="30">
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="btnCreateOrder">Sipariş Oluştur</button>
      <span class="muted">Oluşturulduktan sonra ilgili fırından "Başlat" ile çevrimi başlatın.</span>
    </div>
    <table id="ordersTable">
      <thead><tr>
        <th>Emir No</th><th>Ürün</th><th>Fırın</th><th>Hedef</th><th>Süre</th><th>Durum</th><th>İşlem</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h3>Alarmlar</h3>
    <div id="alarms" class="alarms">
      <div class="muted">Şu anda aktif alarm yok.</div>
    </div>
  </section>
</main>

<script>
const WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/api/ws';
const wsDot = document.getElementById('wsDot');
const wsStatus = document.getElementById('wsStatus');
const furnaceGrid = document.getElementById('furnaceGrid');
const ordersTbody = document.querySelector('#ordersTable tbody');
const alarmsBox = document.getElementById('alarms');
const inpFurnace = document.getElementById('inpFurnace');
const btnReconnect = document.getElementById('btnReconnect');

let furnaces = {};   // name -> DOM kart nesnesi
let orders = [];
let alarmHistory = [];

// WebSocket yönetimi: kopunca SAYFA YENİLENMEZ, sadece sessizce yeniden bağlanır.
// (Eski sürüm location.reload() yapıyordu; bu yüzden form doldururken sayfa sürekli
//  yenileniyor ve sipariş oluşturulamıyordu.)
let ws = null;
let wsRetry = 0;
let wsRetryTimer = null;
let manualReconnect = false;
let restPollTimer = null;
let lastDataAt = 0;

// Bağlantı durumu artık sağ üstteki HIZ kutusunun yanında küçük bir
// etiketle gösteriliyor (eski "Bağlanıyor…" metni yerine).
function setWsState(state, text) {
  wsDot.className = 'ws ' + state;
  wsStatus.textContent = text;
  const info = document.getElementById('speedInfo');
  if (info) {
    if (state === 'online') info.textContent = '· canlı';
    else if (state === 'connecting') info.textContent = '· bağlanıyor';
    else info.textContent = '· çevrimdışı';
  }
}

function connectWs() {
  clearTimeout(wsRetryTimer);
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  if (restPollTimer) { clearInterval(restPollTimer); restPollTimer = null; }

  setWsState('connecting', wsRetry === 0 ? 'Yerel sunucuya bağlanıyor…' : 'Bağlanıyor… (deneme ' + (wsRetry + 1) + ')');

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    wsRetry = 0;
    manualReconnect = false;
    setWsState('online', 'Canlı veri akışı aktif');
    loadSnapshot();   // kaçırılan verileri hemen tazele
  };

  ws.onclose = () => {
    scheduleReconnect();
  };

  ws.onerror = () => { /* onclose otomatik gelir */ };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (msg.type === 'tick') {
      lastDataAt = Date.now();
      updateFurnaces(msg.furnaces);
      orders = msg.orders;
      renderOrders();
      renderAlarms(msg.furnaces, msg.ts);
    }
  };
}

function scheduleReconnect() {
  clearTimeout(wsRetryTimer);
  // Canlı akış yokken 3 sn'de bir REST'ten oku: pano boş kalmaz, form çalışmaya devam eder.
  if (!restPollTimer) {
    restPollTimer = setInterval(() => { if (!ws || ws.readyState !== WebSocket.OPEN) loadSnapshot(); }, 3000);
  }
  const delay = Math.min(1000 * Math.pow(2, wsRetry), 15000);
  wsRetry += 1;
  if (manualReconnect) {
    setWsState('offline', 'Yerel sunucuya ulaşılamıyor — sunucu kapalı olabilir');
  } else {
    setWsState('offline', 'Canlı akış yok, ' + Math.round(delay / 1000) + ' sn içinde yeniden denenecek…');
  }
  wsRetryTimer = setTimeout(() => { manualReconnect = false; connectWs(); }, delay);
}

function reconnectNow() {
  wsRetry = 0;
  manualReconnect = true;
  try { if (ws) ws.close(); } catch (e) { /* yoksay */ }
  ws = null;
  connectWs();
}

btnReconnect.addEventListener('click', reconnectNow);

// ------------------------------------------------------------------ hız kontrolü

let currentSpeed = 1;

function renderSpeedButtons(speeds, active) {
  const box = document.getElementById('speedBtns');
  box.innerHTML = '';
  for (const sp of speeds) {
    const b = document.createElement('button');
    b.textContent = sp + 'x';
    b.title = sp === 1
      ? 'Gerçek zamanlı (yavaş: 750 °C ~10 dk)'
      : sp + ' kat hızlı (fizik modeli aynı, sadece zaman hızlı akar)';
    if (Number(sp) === Number(active)) b.className = 'active';
    b.addEventListener('click', () => setSpeed(sp));
    box.appendChild(b);
  }
}

async function setSpeed(speed) {
  const box = document.getElementById('speedBtns');
  const btns = box.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  try {
    const res = await fetch('/api/speed', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ speed: Number(speed) }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    currentSpeed = data.speed;
    btns.forEach(b => {
      b.className = (b.textContent === currentSpeed + 'x') ? 'active' : '';
    });
  } catch (e) {
    alert('Hız değiştirilemedi: ' + e);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

async function loadSpeed() {
  try {
    const res = await fetch('/api/speed');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    currentSpeed = data.speed;
    renderSpeedButtons(data.adimlar || [1, 2, 5, 10, 25, 50], data.speed);
  } catch (e) {
    // Eski backend'de /api/speed olmayabilir; sessizce geç.
    console.warn('Hız bilgisi alınamadı:', e);
  }
}

// ------------------------------------------------------------------ veri

async function loadSnapshot() {
  try {
    const [fResp, oResp] = await Promise.all([
      fetch('/api/furnaces'), fetch('/api/orders')
    ]);
    if (!fResp.ok || !oResp.ok) throw new Error('HTTP ' + fResp.status + '/' + oResp.status);
    const fData = await fResp.json();
    const oData = await oResp.json();
    if (Object.keys(furnaces).length !== Object.keys(fData).length) {
      buildFurnaceCards(fData);
    }
    updateFurnaces(fData);
    orders = oData;
    renderOrders();
    renderAlarms(fData, Date.now() / 1000);
    lastDataAt = Date.now();
  } catch (e) {
    console.warn('Anlık veri alınamadı:', e);
  }
}

async function init() {
  await loadSpeed();
  await loadSnapshot();
  connectWs();
}

// ------------------------------------------------------------------ fırınlar

function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function buildFurnaceCards(data) {
  furnaceGrid.innerHTML = '';
  for (const [name, s] of Object.entries(data)) {
    const id = 'f-' + slug(name);
    const el = document.createElement('div');
    el.className = 'card';
    el.id = id;
    el.innerHTML = `
      <h2>${escapeHtml(name)} <span class="type">${escapeHtml(s.type)}</span></h2>
      <div class="temp-row">
        <div class="temp" id="t-${slug(name)}">--</div><div class="unit">°C</div>
      </div>
      <div class="meta">
        <span>Hedef: <b id="ht-${slug(name)}">--</b> °C</span>
        <span>Gaz: <b id="g-${slug(name)}">--</b> m³/s</span>
        <span>Enerji: <b id="e-${slug(name)}">--</b> m³</span>
        <span>Evrim: <b id="c-${slug(name)}">--</b> sn</span>
      </div>
      <div class="status OFF" id="st-${slug(name)}">KAPALI</div>
      <div id="br-${slug(name)}" class="meta" style="margin-top:6px;">
        <b>Brülör:</b> <span id="burner-${slug(name)}">KAPALI</span>
      </div>
      <canvas id="sc-${slug(name)}" class="spark"></canvas>
      <div id="al-${slug(name)}" class="alarm-box">🚨 ALARM: <span id="alarmMsg-${slug(name)}"></span></div>
    `;
    furnaceGrid.appendChild(el);
    furnaces[name] = {
      el: el, id: slug(name),
      temps: [], maxSeen: 25, minSeen: 25,
    };
  }
  updateFurnaceSelect(data);
}

function updateFurnaces(data) {
  const now = Date.now();
  for (const [name, s] of Object.entries(data)) {
    const f = furnaces[name];
    if (!f) continue;

    document.getElementById('t-' + f.id).textContent = s.temperature.toFixed(1);
    document.getElementById('ht-' + f.id).textContent = s.target_temperature.toFixed(1);
    document.getElementById('g-' + f.id).textContent = s.gas_consumption.toFixed(2);
    document.getElementById('e-' + f.id).textContent = s.energy_total.toFixed(2);
    document.getElementById('c-' + f.id).textContent = s.cycle_time.toFixed(1);

    const stEl = document.getElementById('st-' + f.id);
    stEl.className = 'status ' + s.status_kodu;
    stEl.textContent = s.status;

    document.getElementById('burner-' + f.id).textContent = s.burner_on ? 'AÇIK 🔥' : 'KAPALI';

    const alarmEl = document.getElementById('al-' + f.id);
    const alarmMsg = document.getElementById('alarmMsg-' + f.id);
    if (s.alarm) {
      alarmEl.className = 'alarm-box show';
      alarmMsg.textContent = s.alarm;
    } else {
      alarmEl.className = 'alarm-box';
    }

    // Geçmiş buffer (sparkline)
    f.temps.push(s.temperature);
    if (f.temps.length > 60) f.temps.shift();
    f.maxSeen = Math.max(f.maxSeen, s.temperature);
    f.minSeen = Math.min(f.minSeen, s.temperature);
    // Grafik çizimi başarısız olsa bile veri güncellemesi devam etsin.
    try { drawSpark(f); } catch (e) { /* grafik opsiyonel */ }
  }
}

function drawSpark(f) {
  const canvas = document.getElementById('sc-' + f.id);
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.parentElement.clientWidth || 260;
  const h = canvas.height = 52;
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = w / dpr, H = h / dpr;
  ctx.clearRect(0, 0, W, H);

  if (f.temps.length < 2) return;
  const min = Math.min(...f.temps);
  const max = Math.max(...f.temps);
  const range = max - min || 10;
  const padX = 6;
  const step = (W - 2 * padX) / (f.temps.length - 1);

  ctx.beginPath();
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  f.temps.forEach((t, i) => {
    const y = H - 10 - ((t - min) / range) * (H - 20);
    const x = padX + i * step;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // hedef satırı (son hedef)
  ctx.strokeStyle = 'rgba(56,189,248,0.35)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(padX, H - 10 - ((f.temps[f.temps.length-1] - min) / range) * (H - 20));
  // basitlik için hedef çizgisi atılmaz (kanalda gösterilmiyor)
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateFurnaceSelect(data) {
  inpFurnace.innerHTML = '';
  for (const name of Object.keys(data)) {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    inpFurnace.appendChild(o);
  }
}

// ------------------------------------------------------------------ emirler

function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleTimeString('tr-TR', { hour12: false });
}

function renderOrders() {
  ordersTbody.innerHTML = '';
  for (const o of orders) {
    const tr = document.createElement('tr');
    const running = o.state === 'RUNNING';
    tr.innerHTML = `
      <td><b>${escapeHtml(o.id)}</b></td>
      <td>${escapeHtml(o.product)}</td>
      <td>${escapeHtml(o.furnace)}</td>
      <td>${o.target_temp.toFixed(0)} °C</td>
      <td>${o.duration_min} dk</td>
      <td><span class="badge ${o.state}">${o.state}</span></td>
      <td>
        ${o.state === 'CREATED'
          ? `<button class="secondary" onclick="startOrder('${o.id}')">Başlat</button>`
          : running ? 'Çevrim devam ediyor…' : (fmtDate(o.finished_at) + ' tamamlandı')}
      </td>
    `;
    ordersTbody.appendChild(tr);
  }
}

async function startOrder(orderId) {
  const furnace = inpFurnace.value;
  if (!furnace) { alert('Lütfen bir fırın seçin.'); return; }
  try {
    const res = await fetch('/api/orders/' + encodeURIComponent(orderId) + '/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ furnace: furnace }),
    });
    if (!res.ok) {
      let detail = await res.text();
      try { detail = JSON.parse(detail).detail || detail; } catch (e) { /* düz metin */ }
      alert('Emir başlatılamadı: ' + detail);
      return;
    }
    await loadSnapshot();
  } catch (e) {
    alert('Sunucuya ulaşılamadı (yerel sunucu kapalı olabilir): ' + e);
  }
}

const btnCreateOrder = document.getElementById('btnCreateOrder');

btnCreateOrder.addEventListener('click', async () => {
  const product = document.getElementById('inpProduct').value.trim();
  const furnace = inpFurnace.value;
  const target = parseFloat(document.getElementById('inpTarget').value);
  const duration = parseFloat(document.getElementById('inpDuration').value);
  if (!product || !furnace || !target || !duration) {
    alert('Tüm alanları doldurun.'); return;
  }
  // Çift tıklama / çift istekle mükerrer sipariş oluşmasın.
  btnCreateOrder.disabled = true;
  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product, furnace, target_temp: target, duration_min: duration }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    document.getElementById('inpProduct').value = '';
    await loadSnapshot();
    if (data && data.id) {
      wsStatus.textContent = data.id + ' oluşturuldu';
      setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) setWsState('online', 'Canlı veri akışı aktif');
      }, 2500);
    }
  } catch (e) {
    alert('Sipariş oluşturulamadı: ' + e);
  } finally {
    btnCreateOrder.disabled = false;
  }
});

// ------------------------------------------------------------------ alarmlar

function renderAlarms(furnacesData, ts) {
  let active = [];
  for (const [name, s] of Object.entries(furnacesData)) {
    if (s.alarm) active.push({ time: ts, furnace: name, message: s.alarm });
  }
  if (active.length) {
    alarmHistory = active.slice(-10).concat(alarmHistory).slice(0, 30);
  }
  if (alarmHistory.length === 0) {
    alarmsBox.innerHTML = '<div class="muted">Şu anda aktif alarm yok.</div>';
    return;
  }
  alarmsBox.innerHTML = alarmHistory.map(a =>
    `<div class="alarm-item"><span class="time">${fmtDate(a.time)}</span><b>${escapeHtml(a.furnace)}:</b> ${escapeHtml(a.message)}</div>`
  ).join('');
}

function escapeHtml(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

init();
</script>
